<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu per Periode — SIPOGIM</title>
<link rel="stylesheet" href="sipogim.css">
</head>
<body>
  <div class="sg-topbar">
    <div><strong>SIPOGIM</strong><small>Portal SPPG Jeungjing</small></div>
    <span class="sg-topbar-spacer"></span>
  </div>
  <nav class="sg-tabs">
    <a class="sg-tab" href="beranda.html">Beranda</a>
    <a class="sg-tab active" href="menu.html">Menu</a>
    <a class="sg-tab" href="resep.html">Resep</a>
    <a class="sg-tab" href="bahan.html">Bahan</a>
    <a class="sg-tab" href="lainnya.html">Lainnya</a>
  </nav>

  <main class="sg-main">
    <div class="sg-card">
      <p class="sg-title">Menu per Periode</p>
      <div class="sg-field" style="margin:10px 0 0;">
        <select class="sg-select" id="pilihPeriode"><option value="">Memuat periode...</option></select>
      </div>
    </div>

    <div id="tampilanDaftarTanggal">
      <p class="sg-empty">Pilih periode di atas.</p>
    </div>

    <!-- Detail satu hari -- disembunyikan sampai salah satu tanggal diketuk -->
    <div class="sg-card" id="kartuDetail" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <p class="sg-title" id="judulDetail" style="margin:0;"></p>
        <button class="sg-btn" id="btnTutupDetail">✕</button>
      </div>
      <div id="isiDetail" style="margin-top:10px;"></div>
      <div id="kartuTotal" style="margin-top:14px; display:none;">
        <p class="sg-title" style="font-size:15px;">Total Hari</p>
        <div id="isiTotal"></div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="sg-btn success" id="btnSalinBesar">📋 Salin Porsi Besar</button>
          <button class="sg-btn success" id="btnSalinKecil">📋 Salin Porsi Kecil</button>
        </div>
      </div>
    </div>
  </main>

  <script src="sipogim-config.js"></script>
  <script src="sipogim-common.js"></script>
  <script>
    wajibLoginSipogim();
    pastikanNamaSayaSipogim();

    const LABEL_PADANAN = {
      terkonfirmasi: ['Resep terpasang', 'status-success'],
      usulan: ['Usulan menunggu', 'status-warning'],
      belum_ada_resep: ['Belum ada resep', 'status-danger'],
      diabaikan: ['Diabaikan', 'status-warning']
    };

    async function muatDaftarPeriode() {
      try {
        const daftar = await apiPostSipogim('getPeriodeList', {});
        const sel = document.getElementById('pilihPeriode');
        if (!daftar.length) { sel.innerHTML = '<option value="">Belum ada periode tersinkron</option>'; return; }
        sel.innerHTML = daftar.map(p => `<option value="${escapeHtmlSipogim(p)}">${escapeHtmlSipogim(p)}</option>`).join('');
        sel.addEventListener('change', muatDaftarTanggal);
        muatDaftarTanggal();
      } catch (err) { tampilkanGalatSipogim('tampilanDaftarTanggal', err); }
    }

    async function muatDaftarTanggal() {
      const periode = document.getElementById('pilihPeriode').value;
      const wadah = document.getElementById('tampilanDaftarTanggal');
      if (!periode) { wadah.innerHTML = '<p class="sg-empty">Pilih periode.</p>'; return; }
      wadah.innerHTML = '<p class="sg-empty">Memuat...</p>';
      try {
        const daftar = await apiPostSipogim('getMenuPeriode', { periode });
        wadah.innerHTML = daftar.length ? daftar.map(t => `
          <div class="sg-card" style="cursor:pointer;" onclick="bukaDetail('${t.tanggal}')">
            <strong>${escapeHtmlSipogim(t.tanggal)}</strong>
            <span style="float:right; color:var(--color-text-muted); font-size:13px;">${t.jumlahKomponen} komponen</span>
          </div>`).join('') : '<p class="sg-empty">Belum ada tanggal terisi di periode ini.</p>';
      } catch (err) { tampilkanGalatSipogim(wadah, err); }
    }

    let tanggalDibuka = null;
    function renderPeringatanBerubah(info, labelPorsi) {
      if (!info || !info.berubah) return '';
      const baris = (nama, kunci, satuan) => info.baru
        ? `${nama}: ${formatAngkaSipogim(info.lama[kunci],1)} → <strong>${formatAngkaSipogim(info.baru[kunci],1)}</strong> ${satuan}<br>`
        : '';
      return `<div class="sg-error" style="background:#fff3cd; color:#8a5a12;">
        ⚠️ <strong>Berubah sejak disalin (Porsi ${labelPorsi})</strong> -- disalin ${new Date(info.waktuSalin || Date.now()).toLocaleDateString('id-ID')}<br>
        ${info.alasan ? escapeHtmlSipogim(info.alasan) : baris('Energi','energiKkal','kkal') + baris('Protein','proteinG','g') + baris('Lemak','lemakG','g') + baris('KH','karbohidratG','g') + baris('Serat','seratG','g')}
      </div>`;
    }
    function renderTotal(hasil, idWadah) {
      if (!hasil.lengkap) {
        return `<p style="color:var(--color-danger); font-size:13px;"><strong>Belum lengkap:</strong></p>
          <ul style="font-size:12.5px; padding-left:18px; color:var(--color-text-muted);">${hasil.penyebab.map(p => `<li>${escapeHtmlSipogim(p)}</li>`).join('')}</ul>`;
      }
      const g = hasil.gizi;
      return `<div style="font-size:14px;">Energi: <strong>${formatAngkaSipogim(g.energiKkal,1)} kkal</strong> · Protein: <strong>${formatAngkaSipogim(g.proteinG,1)} g</strong> · Lemak: <strong>${formatAngkaSipogim(g.lemakG,1)} g</strong> · KH: <strong>${formatAngkaSipogim(g.karbohidratG,1)} g</strong> · Serat: <strong>${formatAngkaSipogim(g.seratG,1)} g</strong></div>`;
    }

    async function bukaDetail(tanggal) {
      tanggalDibuka = tanggal;
      const kartu = document.getElementById('kartuDetail');
      const isi = document.getElementById('isiDetail');
      document.getElementById('judulDetail').textContent = tanggal;
      isi.innerHTML = '<p class="sg-empty">Memuat...</p>';
      document.getElementById('kartuTotal').style.display = 'none';
      kartu.style.display = 'block';
      kartu.scrollIntoView({ behavior: 'smooth' });
      try {
        const d = await apiPostSipogim('getMenuHarian', { tanggal });
        isi.innerHTML = d.komponen.map(k => {
          const [label, kelas] = LABEL_PADANAN[k.statusPadanan] || ['-', 'status-warning'];
          return `<div class="sg-list-item">
            <strong>${escapeHtmlSipogim(k.kategori)}:</strong> ${escapeHtmlSipogim(k.namaMentah)}
            <span class="sg-badge ${kelas}" style="margin-left:6px;">${label}</span>
          </div>`;
        }).join('');
        document.getElementById('isiTotal').innerHTML =
          renderPeringatanBerubah(d.perubahanSejakSalin.besar, 'Besar') +
          '<p style="font-size:12.5px; font-weight:700; margin:8px 0 2px;">Porsi Besar</p>' + renderTotal(d.totalHariBesar) +
          renderPeringatanBerubah(d.perubahanSejakSalin.kecil, 'Kecil') +
          '<p style="font-size:12.5px; font-weight:700; margin:10px 0 2px;">Porsi Kecil</p>' + renderTotal(d.totalHariKecil);
        document.getElementById('btnSalinBesar').disabled = !d.totalHariBesar.lengkap;
        document.getElementById('btnSalinKecil').disabled = !d.totalHariKecil.lengkap;
        document.getElementById('kartuTotal').style.display = 'block';
      } catch (err) { tampilkanGalatSipogim(isi, err); }
    }

    async function salinKePoP(porsi) {
      const hasil = await apiPostSipogim('getMenuHarian', { tanggal: tanggalDibuka });
      const data = porsi === 'besar' ? hasil.totalHariBesar : hasil.totalHariKecil;
      if (!data.lengkap) { alert('Belum lengkap, tidak bisa disalin.'); return; }
      const g = data.gizi;
      const teks = `${g.energiKkal}\t${g.proteinG}\t${g.lemakG}\t${g.karbohidratG}\t${g.seratG}`;
      try {
        await navigator.clipboard.writeText(teks);
        await apiPostSipogim('catatSalin', { tanggal: tanggalDibuka, porsi });
        alert('Tersalin! (Energi, Protein, Lemak, KH, Serat dipisah Tab -- siap ditempel ke form PoP)');
      } catch (err) { alert('Gagal menyalin ke clipboard: ' + err.message); }
    }
    document.getElementById('btnSalinBesar').addEventListener('click', () => salinKePoP('besar'));
    document.getElementById('btnSalinKecil').addEventListener('click', () => salinKePoP('kecil'));
    document.getElementById('btnTutupDetail').addEventListener('click', () => { document.getElementById('kartuDetail').style.display = 'none'; });

    muatDaftarPeriode();
  </script>
</body>
</html>
