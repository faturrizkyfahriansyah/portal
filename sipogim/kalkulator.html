<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator Bebas — SIPOGIM</title>
<link rel="stylesheet" href="sipogim.css">
<style>
  .baris-k { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .baris-k select { flex:2; min-width:0; } .baris-k input { flex:1; min-width:0; }
</style>
</head>
<body>
  <div class="sg-topbar">
    <div><strong>SIPOGIM</strong><small>Portal SPPG Jeungjing</small></div>
    <span class="sg-topbar-spacer"></span>
  </div>
  <nav class="sg-tabs">
    <a class="sg-tab" href="beranda.html">Beranda</a>
    <a class="sg-tab" href="menu.html">Menu</a>
    <a class="sg-tab" href="resep.html">Resep</a>
    <a class="sg-tab" href="bahan.html">Bahan</a>
    <a class="sg-tab active" href="lainnya.html">Lainnya</a>
  </nav>

  <main class="sg-main">
    <div class="sg-card">
      <p class="sg-title">Kalkulator Bebas</p>
      <p class="sg-subtitle">Coba-coba cepat, tidak tersimpan sebagai resep.</p>
      <div id="daftarBaris" style="margin-top:10px;"></div>
      <button class="sg-btn" id="btnTambahBaris" type="button">+ Tambah Bahan</button>
      <button class="sg-btn primary block" id="btnHitung" style="margin-top:10px;">Hitung</button>
    </div>
    <div class="sg-card" id="kartuHasil" style="display:none;">
      <p class="sg-title">Hasil</p>
      <div id="isiHasil"></div>
    </div>
  </main>

  <script src="sipogim-config.js"></script>
  <script src="sipogim-common.js"></script>
  <script>
    wajibLoginSipogim();
    pastikanNamaSayaSipogim();
    let daftarSemuaBahan = [];

    function opsiBahanHtml() {
      return '<option value="">Pilih bahan...</option>' + daftarSemuaBahan.map(b =>
        `<option value="${b.id}">${escapeHtmlSipogim(b.nama)}${!b.lengkap ? ' (belum lengkap)' : ''}</option>`).join('');
    }
    function tambahBaris() {
      const div = document.createElement('div');
      div.className = 'baris-k';
      div.innerHTML = `<select class="sg-select">${opsiBahanHtml()}</select><input class="sg-input" type="number" step="0.1" placeholder="gram"><button class="sg-btn" type="button" onclick="this.parentElement.remove()">✕</button>`;
      document.getElementById('daftarBaris').appendChild(div);
    }
    document.getElementById('btnTambahBaris').addEventListener('click', tambahBaris);

    document.getElementById('btnHitung').addEventListener('click', async () => {
      const bahan = Array.from(document.querySelectorAll('#daftarBaris .baris-k')).map(div => {
        const [sel, g] = div.querySelectorAll('select, input');
        return { bahanId: sel.value, gram: g.value };
      }).filter(b => b.bahanId);

      const kartu = document.getElementById('kartuHasil');
      const isi = document.getElementById('isiHasil');
      kartu.style.display = 'block';
      isi.innerHTML = '<p class="sg-empty">Menghitung...</p>';
      try {
        const hasil = await apiPostSipogim('hitungBebas', { bahan });
        if (!hasil.lengkap) {
          isi.innerHTML = `<p style="color:var(--color-danger); font-weight:700;">Belum lengkap</p>
            <ul style="font-size:13px; padding-left:18px;">${hasil.penyebab.map(p => `<li>${escapeHtmlSipogim(p)}</li>`).join('')}</ul>`;
        } else {
          const g = hasil.gizi;
          isi.innerHTML = `<div style="font-size:15px;">
            Energi: <strong>${formatAngkaSipogim(g.energiKkal,1)} kkal</strong><br>
            Protein: <strong>${formatAngkaSipogim(g.proteinG,1)} g</strong><br>
            Lemak: <strong>${formatAngkaSipogim(g.lemakG,1)} g</strong><br>
            Karbohidrat: <strong>${formatAngkaSipogim(g.karbohidratG,1)} g</strong><br>
            Serat: <strong>${formatAngkaSipogim(g.seratG,1)} g</strong></div>`;
        }
      } catch (err) { tampilkanGalatSipogim(isi, err); }
    });

    apiPostSipogim('getBahanList', {}).then(d => { daftarSemuaBahan = d; tambahBaris(); })
      .catch(err => alert('⚠️ Gagal memuat daftar bahan: ' + err.message));
  </script>
</body>
</html>
