<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk — SIPOGIM</title>
<link rel="stylesheet" href="css/sipogim.css">
</head>
<body>
  <div class="sg-topbar"><span class="sg-topbar-spacer"></span></div>
  <main class="sg-main" style="max-width:420px; padding-top:40px;">
    <div style="text-align:center; margin-bottom:22px;">
      <div style="font-size:15px; font-weight:800; color:var(--color-navy); letter-spacing:.03em;">PORTAL SPPG JEUNGJING</div>
      <div style="font-size:22px; font-weight:900; color:var(--color-sky); margin-top:4px;">SIPOGIM</div>
      <div style="font-size:12.5px; color:var(--color-text-muted); margin-top:2px;">Sistem Informasi Gizi &amp; Menu</div>
    </div>
    <div class="sg-card" style="text-align:center;">
      <!-- 4 Nov 2026 (keputusan Admin): SIPOGIM TIDAK punya login sendiri. Masuk hanya lewat sesi Portal + pemberian akses per relawan
           (Portal: Manajemen Hak Akses > Akses Per Relawan). Halaman ini otomatis menukar sesi Portal dengan token aplikasi. -->
      <p id="sgStatus" style="font-size:14px;margin:6px 0 14px;">Memeriksa akses dari Portal…</p>
      <div id="sgTombol" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;"></div>
    </div>
  </main>
  <script src="../core/config.js"></script>
  <script src="js/sipogim-config.js"></script>
  <script>
  (function () {
    var PORTAL = (typeof GOOGLE_APPS_SCRIPT_WEB_APP_URL !== 'undefined') ? GOOGLE_APPS_SCRIPT_WEB_APP_URL : '';
    var st = document.getElementById('sgStatus'), tb = document.getElementById('sgTombol');
    function sesiPortal() {
      var k = ['sppgRelawanSession', 'sppgAdminSession'];
      for (var i = 0; i < k.length; i++) { try { var s = JSON.parse(localStorage.getItem(k[i]) || 'null'); if (s && s.token) return { token: s.token, admin: k[i] === 'sppgAdminSession' }; } catch (e) { /* abaikan */ } }
      return null;
    }
    function tombol(teks, aksi, utama) { var b = document.createElement('button'); b.type = 'button'; b.className = utama ? 'sg-btn sg-btn-primary' : 'sg-btn'; b.textContent = teks; b.onclick = aksi; tb.appendChild(b); }
    function ke(url) { return function () { location.href = url; }; }
    function tolak(pesan, sesi) {
      st.textContent = pesan; st.style.color = '#c0392b'; tb.innerHTML = '';
      tombol('Coba lagi', mulai, true); tombol('Kembali ke Portal', ke(sesi && sesi.admin ? '../admin.html' : '../dashboard.html'), false);
    }
    function mulai() {
      tb.innerHTML = ''; st.style.color = ''; st.textContent = 'Memeriksa akses dari Portal…';
      var sesi = sesiPortal();
      if (!sesi) { st.textContent = 'Anda belum masuk Portal. SIPOGIM dibuka dari Portal.'; tombol('Masuk ke Portal', ke('../login.html'), true); return; }
      fetch(PORTAL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', body: JSON.stringify({ action: 'terbitkanTokenAplikasi', token: sesi.token, kodeModul: 'SIPOGIM' }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.success) return tolak(j.message || 'Akses ditolak.', sesi);
          sessionStorage.setItem('sipogim_token', j.data.token);
          if (!localStorage.getItem('sipogim_nama_saya') && j.data.nama) localStorage.setItem('sipogim_nama_saya', j.data.nama);
          st.textContent = 'Akses diberikan. Membuka SIPOGIM…'; location.replace('beranda.html');
        })
        .catch(function () { tolak('Tidak dapat terhubung ke Portal. Periksa koneksi internet.', sesi); });
    }
    mulai();
  })();
  </script>
</body>
</html>
