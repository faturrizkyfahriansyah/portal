<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login — SIPOGIM</title>
<link rel="stylesheet" href="sipogim.css">
</head>
<body>
  <div class="sg-topbar">
    <span class="sg-topbar-spacer"></span>
  </div>
  <main class="sg-main" style="max-width:380px; padding-top:40px;">
    <div style="text-align:center; margin-bottom:22px;">
      <div style="font-size:15px; font-weight:800; color:var(--color-navy); letter-spacing:.03em;">PORTAL SPPG JEUNGJING</div>
      <div style="font-size:22px; font-weight:900; color:var(--color-sky); margin-top:4px;">SIPOGIM</div>
      <div style="font-size:12.5px; color:var(--color-text-muted); margin-top:2px;">Sistem Informasi Gizi &amp; Menu</div>
    </div>

    <div class="sg-card">
      <form id="formLogin">
        <div class="sg-field">
          <label for="inputUsername">Username</label>
          <input class="sg-input" id="inputUsername" type="text" autocomplete="username" required>
        </div>
        <div class="sg-field">
          <label for="inputSandi">Kata Sandi</label>
          <div style="position:relative;">
            <input class="sg-input" id="inputSandi" type="password" autocomplete="current-password" required style="padding-right:46px;">
            <button type="button" id="btnLihatSandi" aria-label="Lihat kata sandi" style="position:absolute; right:4px; top:4px; bottom:4px; width:40px; border:none; background:none; cursor:pointer; color:var(--color-text-muted); font-size:18px;">👁️</button>
          </div>
        </div>
        <button type="submit" class="sg-btn primary block" id="btnLogin">Masuk</button>
        <p id="galatLogin" class="sg-error" style="display:none;"></p>
      </form>
      <p style="text-align:center; margin:10px 0 0;">
        <a href="#" id="tautanLupaSandi" style="font-size:13px; color:var(--color-sky);">Lupa kata sandi?</a>
      </p>
    </div>
    <p style="text-align:center; font-size:11.5px; color:var(--color-text-muted);">Akun bersama tim gizi SPPG Jeungjing.</p>
  </main>

  <script src="sipogim-config.js"></script>
  <script src="sipogim-common.js"></script>
  <script>
    if (sesiSipogimAda()) location.href = 'beranda.html';

    document.getElementById('btnLihatSandi').addEventListener('click', () => {
      const input = document.getElementById('inputSandi');
      const tampil = input.type === 'password';
      input.type = tampil ? 'text' : 'password';
      document.getElementById('btnLihatSandi').textContent = tampil ? '🙈' : '👁️';
    });

    // Akun ini BERSAMA (1 kata sandi utk seluruh tim, lihat spesifikasi) --
    // tidak ada email per-pengguna utk reset otomatis. "Lupa kata sandi"
    // di sini mengarahkan ke jalur pemulihan yg SUDAH ADA (lewat editor
    // Apps Script), bukan membangun sistem reset-email terpisah yg
    // sebenarnya tidak dibutuhkan utk tim 1-2 orang.
    document.getElementById('tautanLupaSandi').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Kata sandi ini dipakai bersama satu tim, jadi tidak ada reset otomatis lewat email.\n\nUntuk mengatur ulang:\n1. Hubungi pengelola teknis Portal.\n2. Buka proyek Apps Script SIPOGIM.\n3. Jalankan fungsi "jalankanSetKataSandiAwal" dengan kata sandi baru (lihat Setup.gs).\n\nKalau mau cara yang lebih mudah (reset sendiri lewat email), beri tahu -- itu bisa dibangun juga.');
    });

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const galat = document.getElementById('galatLogin');
      const btn = document.getElementById('btnLogin');
      galat.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Memeriksa...';
      try {
        const hasil = await apiPostSipogim('login', {
          username: document.getElementById('inputUsername').value.trim(),
          kataSandi: document.getElementById('inputSandi').value
        });
        sessionStorage.setItem('sipogim_token', hasil.token);
        pastikanNamaSayaSipogim();
        location.href = 'beranda.html';
      } catch (err) {
        galat.textContent = '⚠️ ' + err.message;
        galat.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
