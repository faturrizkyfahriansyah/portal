<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12294d">
<title>Lupa Password — SPPG Jeungjing</title>
<link rel="icon" href="assets/logo.png">
<style>
:root{--navy:#12294d;--gold:#c9962c;--g:#14634a;--gl:#e6f3ee;--ink:#1c2430;--mut:#5b6573;--line:#d9dee6;--bg:#f4f6f9;--red:#b3261e;--redl:#fdecea;--amb:#8a5a00;--ambl:#fff4d6}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:20px 16px 16px;text-align:center}
header img{height:42px;margin:0 6px}header h1{font-size:20px;margin:8px 0 2px}header p{margin:0;opacity:.85;font-size:15px}
main{max-width:520px;margin:0 auto;padding:16px 16px 60px}
h2{font-size:19px;margin:6px 0 10px}
.kartu{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-left:6px solid var(--navy);border-radius:16px;padding:14px 16px;margin:0 0 10px;color:inherit;min-height:72px;cursor:pointer;font:inherit}
.kartu:active{transform:scale(.99)}.kartu .ic{flex:none;width:44px;height:44px;border-radius:12px;background:#eef2f9;display:grid;place-items:center;font-size:24px}
.kartu b{display:block;font-size:18px}.kartu span{display:block;color:var(--mut);font-size:14px}
.kartu.pic{border-left-color:var(--gold)}.kartu.stf{border-left-color:#2e7d6b}
.note{border-radius:12px;padding:10px 12px;font-size:14.5px;margin:12px 0;background:var(--gl);color:#0e4d39}
.note.warn{background:var(--ambl);color:var(--amb)}.note.err{background:var(--redl);color:var(--red)}
.fld{margin:0 0 14px}.fld label{display:block;font-weight:700;margin-bottom:2px}.fld .hint{color:var(--mut);font-size:14px;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:18px;background:#fff;min-height:52px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:3px solid #b9c8e6;border-color:var(--navy)}
.fld input.kode{font-size:30px;letter-spacing:.35em;text-align:center}
.msg{font-size:15px;margin:6px 0 10px;min-height:20px}.msg.err{color:var(--red)}.msg.ok{color:var(--g)}
.btn{border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;padding:14px 18px;cursor:pointer;min-height:52px;font-size:17px;width:100%}
.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy);margin-top:10px}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.link{background:none;color:var(--navy);text-decoration:underline;font-weight:600;min-height:44px;width:auto;padding:8px 0}
a.balik{display:block;text-align:center;margin-top:16px;color:var(--navy);font-weight:600}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.langkah{display:flex;gap:6px;margin:0 0 14px}.langkah i{flex:1;height:6px;border-radius:3px;background:var(--line)}.langkah i.on{background:var(--navy)}
.ok-ic{text-align:center;margin:10px 0;color:var(--g);line-height:0}
.pw{position:relative}.pw input{padding-right:56px}
.mata{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center;border-radius:12px}
.mata:focus-visible{outline:3px solid #b9c8e6}
.mata svg{display:block}
</style></head><body>
<header><img src="assets/logo-bgn.png" alt=""><img src="assets/logo.png" alt=""><h1>Lupa Password</h1><p>Kode dikirim lewat WhatsApp</p></header>
<main id="app"></main>
<script src="core/config.js?v=20260903b"></script>
<script src="core/common.js?v=20261014a"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var WA_ADMIN = 'https://wa.me/6285694765370?text=' + encodeURIComponent('Halo Admin, saya butuh bantuan akun Portal SPPG Jeungjing.');
  var WA_DAFTAR = 'https://wa.me/6285694765370?text=' + encodeURIComponent('Halo Admin, saya ingin daftar akun Portal SPPG Jeungjing.');
  // Satu alur untuk Relawan, Staff, dan PIC: server mengenali jenis akun dari nomor WhatsApp.
  var JENIS = { RELAWAN: { nama: 'Relawan', pin: false }, STAFF: { nama: 'Staff', pin: false }, PIC: { nama: 'PIC', pin: false } };
  var S = { jenis: '', opsi: [], hp: '', token: '', jeda: 0, timer: null };
  var SVG = 'xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  var MATA = '<path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/>';

  function h(tag, a, kids) {
    var e = document.createElement(tag); a = a || {};
    Object.keys(a).forEach(function (k) { if (k === 'text') e.textContent = a[k]; else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), a[k]); else if (k === 'class') e.className = a[k]; else e.setAttribute(k, a[k]); });
    (Array.isArray(kids) ? kids : kids === undefined ? [] : [kids]).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function bersih() { if (S.timer) { clearInterval(S.timer); S.timer = null; } app.textContent = ''; }
  function judul(t) { return h('h2', { text: t }); }
  function bar(n) { var w = h('div', { class: 'langkah' }); for (var i = 1; i <= 3; i++) w.appendChild(h('i', { class: i <= n ? 'on' : '' })); return w; }
  function adminLink() { return h('p', { style: 'text-align:center;font-size:14px;color:#5b6573' }, ['Butuh bantuan? ', h('a', { href: WA_ADMIN, target: '_blank', rel: 'noopener', text: 'Hubungi Admin lewat WhatsApp', style: 'color:#12294d;font-weight:700' })]); }
  function kembali(href, teks) { return h('a', { class: 'balik', href: href || 'masuk.html', text: teks || '← Kembali ke halaman masuk' }); }
  // Kolom sandi dengan ikon mata (SVG garis, bukan emoji).
  function kolomSandi(input) {
    var btn = h('button', { type: 'button', class: 'mata', 'aria-label': 'Tampilkan password', title: 'Tampilkan password' });
    function gambar(tampil) { btn.innerHTML = '<svg ' + SVG + ' width="24" height="24">' + MATA + (tampil ? '<path d="M3 3l18 18"/>' : '') + '</svg>'; var t = tampil ? 'Sembunyikan password' : 'Tampilkan password'; btn.setAttribute('aria-label', t); btn.setAttribute('title', t); }
    gambar(false);
    btn.addEventListener('click', function () { var t = input.type === 'password'; input.type = t ? 'text' : 'password'; gambar(t); });
    return h('div', { class: 'pw' }, [input, btn]);
  }

  /* ---- 1. nomor WhatsApp ---- */
  function formHp(pesan) {
    bersih(); S.token = ''; S.jenis = ''; S.opsi = [];
    var hp = h('input', { type: 'tel', id: 'hp', inputmode: 'tel', autocomplete: 'tel', placeholder: '08xxxxxxxxxx', value: S.hp }),
      jebak = h('input', { type: 'text', name: 'website', tabindex: '-1', autocomplete: 'off', 'aria-hidden': 'true' }),
      msg = h('div', { class: 'msg err', 'aria-live': 'polite', text: pesan || '' }),
      btn = h('button', { class: 'btn', type: 'button', text: 'Kirim kode ke WhatsApp', onclick: kirim });
    function kirim() {
      msg.textContent = ''; var nomor = hp.value.trim(); if (!nomor) { msg.textContent = 'Isi nomor WhatsApp.'; return; }
      btn.disabled = true; btn.textContent = 'Mengirim…';
      apiPost('otpMinta', { nomorHp: nomor, website: jebak.value }).then(function (r) {
        S.hp = nomor; S.jeda = (r && r.jedaDetik) || 60; formKode(r && r.pesan);
      }).catch(function (e) { msg.textContent = e.message; btn.disabled = false; btn.textContent = 'Kirim kode ke WhatsApp'; });
    }
    app.appendChild(bar(1)); app.appendChild(judul('Masukkan nomor WhatsApp'));
    app.appendChild(h('div', { class: 'fld' }, [h('label', { for: 'hp', text: 'Nomor WhatsApp' }), h('div', { class: 'hint', text: 'Nomor yang terdaftar di akun Anda. Kode dikirim ke sini.' }), hp]));
    app.appendChild(h('div', { class: 'hp', 'aria-hidden': 'true' }, [h('label', { text: 'Jangan isi kolom ini' }), jebak]));
    app.appendChild(msg); app.appendChild(btn); app.appendChild(adminLink());
    app.appendChild(h('p', { style: 'text-align:center;font-size:13.5px;color:#5b6573' }, ['Akun Admin utama tidak memakai kode WhatsApp. ', h('a', { href: 'admin.html#reset', text: 'Pakai kode dari pengelola sistem', style: 'color:#12294d;font-weight:600' })]));
    app.appendChild(kembali());
    hp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') kirim(); });
  }

  /* ---- 2. kode ---- */
  function formKode(pesanServer) {
    bersih();
    var kode = h('input', { type: 'text', id: 'kode', class: 'kode', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', placeholder: '••••••' }),
      msg = h('div', { class: 'msg err', 'aria-live': 'polite' }), btn = h('button', { class: 'btn', type: 'button', text: 'Periksa kode', onclick: cek }),
      ulang = h('button', { class: 'btn sec', type: 'button', disabled: 'disabled', text: 'Kirim ulang kode', onclick: function () { formHp(); } });
    function cek() {
      msg.textContent = ''; var k = kode.value.trim(); if (!/^\d{6}$/.test(k)) { msg.textContent = 'Isi 6 angka kode dari WhatsApp.'; return; }
      btn.disabled = true; btn.textContent = 'Memeriksa…';
      apiPost('otpVerifikasi', { nomorHp: S.hp, kode: k }).then(function (r) {
        S.token = r.token; S.opsi = (r.opsi || []).filter(function (j) { return JENIS[j]; });
        if (!S.opsi.length) { formHp('Akun tidak dapat diubah lewat jalur ini. Hubungi Admin.'); return; }
        if (S.opsi.length === 1) { S.jenis = S.opsi[0]; formIsi(); } else formPilih();
      }).catch(function (e) { msg.textContent = e.message; btn.disabled = false; btn.textContent = 'Periksa kode'; kode.value = ''; if (/hangus|kedaluwarsa/i.test(e.message)) ulang.disabled = false; });
    }
    kode.addEventListener('input', function () { kode.value = kode.value.replace(/\D/g, '').slice(0, 6); if (kode.value.length === 6) cek(); });
    app.appendChild(bar(2)); app.appendChild(judul('Masukkan kode dari WhatsApp'));
    app.appendChild(h('div', { class: 'note', text: pesanServer || 'Jika nomor memenuhi syarat, kode 6 angka sudah dikirim lewat WhatsApp. Berlaku 5 menit.' }));
    app.appendChild(h('div', { class: 'note warn', text: 'Tidak ada kode yang masuk? Pastikan nomor benar dan terdaftar. Demi keamanan, sistem tidak menyebut apakah nomor terdaftar.' }));
    app.appendChild(h('div', { class: 'fld' }, [h('label', { for: 'kode', text: 'Kode 6 angka' }), kode])); app.appendChild(msg); app.appendChild(btn); app.appendChild(ulang);
    var sisa = S.jeda; ulang.textContent = 'Kirim ulang kode (' + sisa + ')';
    S.timer = setInterval(function () { sisa--; if (sisa <= 0) { clearInterval(S.timer); S.timer = null; ulang.disabled = false; ulang.textContent = 'Kirim ulang kode'; } else ulang.textContent = 'Kirim ulang kode (' + sisa + ')'; }, 1000);
    app.appendChild(adminLink()); setTimeout(function () { kode.focus(); }, 50);
  }

  /* ---- 2b. satu nomor dipakai beberapa jenis akun: pilih (hanya tampil setelah kode benar) ---- */
  function formPilih() {
    bersih(); app.appendChild(bar(2)); app.appendChild(judul('Akun mana yang diubah?'));
    app.appendChild(h('div', { class: 'note', text: 'Nomor ini dipakai lebih dari satu jenis akun. Pilih salah satu.' }));
    S.opsi.forEach(function (j) { app.appendChild(h('button', { class: 'btn sec', type: 'button', text: JENIS[j].nama, onclick: function () { S.jenis = j; formIsi(); } })); });
  }

  /* ---- 3. sandi baru ---- */
  function formIsi(pesan) {
    bersih();
    var pic = JENIS[S.jenis].pin;
    var p1 = h('input', { type: 'password', id: 'p1', autocomplete: 'new-password', inputmode: pic ? 'numeric' : 'text', maxlength: pic ? '6' : '72' }), p2 = h('input', { type: 'password', id: 'p2', autocomplete: 'new-password', inputmode: pic ? 'numeric' : 'text', maxlength: pic ? '6' : '72' }),
      msg = h('div', { class: 'msg err', 'aria-live': 'polite', text: pesan || '' }), btn = h('button', { class: 'btn', type: 'button', text: pic ? 'Simpan PIN' : 'Simpan password', onclick: simpan });
    if (pic) [p1, p2].forEach(function (x) { x.addEventListener('input', function () { x.value = x.value.replace(/\D/g, '').slice(0, 6); }); });
    function simpan() {
      msg.textContent = ''; if (p1.value !== p2.value) { msg.textContent = 'Pengulangan tidak sama.'; return; }
      if (pic && !/^\d{6}$/.test(p1.value)) { msg.textContent = 'PIN harus 6 angka.'; return; } if (!pic && p1.value.length < 8) { msg.textContent = 'Password minimal 8 karakter.'; return; }
      btn.disabled = true; btn.textContent = 'Menyimpan…';
      var body = { tokenOtp: S.token, jenis: S.jenis }; if (pic) body.pinBaru = p1.value; else { body.passwordBaru = p1.value; body.sandiUlang = p2.value; }
      apiPost('otpAtur', body).then(function (r) { selesai(r && r.pesan); }).catch(function (e) {
        msg.textContent = e.message; btn.disabled = false; btn.textContent = pic ? 'Simpan PIN' : 'Simpan password';
        if (/berakhir/i.test(e.message)) setTimeout(function () { S.hp = ''; formHp('Verifikasi sudah berakhir. Minta kode baru.'); }, 1800);
      });
    }
    app.appendChild(bar(3)); app.appendChild(judul(pic ? 'Buat PIN baru' : 'Buat password baru'));
    app.appendChild(h('div', { class: 'note', text: 'Nomor sudah terverifikasi. ' + (pic ? 'Pilih 6 angka yang tidak berurutan atau berulang. Jangan bagikan PIN.' : 'Minimal 8 karakter. Jangan sama dengan username.') }));
    app.appendChild(h('div', { class: 'fld' }, [h('label', { for: 'p1', text: pic ? 'PIN baru (6 angka)' : 'Password baru' }), kolomSandi(p1)])); app.appendChild(h('div', { class: 'fld' }, [h('label', { for: 'p2', text: 'Ulangi' }), p2]));
    app.appendChild(msg); app.appendChild(btn);
  }

  /* ---- 4. selesai ---- */
  function selesai(pesan) {
    bersih();
    var ok = h('div', { class: 'ok-ic' }); ok.innerHTML = '<svg ' + SVG + ' width="56" height="56"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-7"/></svg>';
    app.appendChild(ok); app.appendChild(h('h2', { text: 'Berhasil', style: 'text-align:center' }));
    app.appendChild(h('div', { class: 'note', text: pesan || 'Tersimpan.' }));
    app.appendChild(h('a', { href: 'masuk.html', class: 'btn', style: 'display:block;text-align:center;text-decoration:none;line-height:24px', text: 'Masuk sekarang' }));
    S.token = '';
  }

  /* ---- mulai ---- */
  function awal() {
    // Pendaftaran tidak lagi lewat halaman ini: dialihkan ke WhatsApp Admin (tautan lama ?mode=daftar tetap berguna).
    if (/(^|[?&])mode=daftar(&|$)/i.test(location.search)) { location.replace(WA_DAFTAR); return; }
    app.appendChild(h('div', { class: 'note', text: 'Memeriksa layanan…' }));
    apiPost('getStatusOtp', {}).then(function (r) {
      bersih();
      if (!r || !r.aktif) { app.appendChild(h('div', { class: 'note warn', text: 'Layanan kode WhatsApp belum aktif. Silakan hubungi Admin.' })); app.appendChild(adminLink()); app.appendChild(kembali()); return; }
      formHp();
    }).catch(function (e) { bersih(); app.appendChild(h('div', { class: 'note err', text: e.message })); app.appendChild(adminLink()); });
  }
  awal();
})();
</script>
</body></html>
