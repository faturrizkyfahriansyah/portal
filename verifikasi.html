<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12294d">
<title>Verifikasi WhatsApp — SPPG Jeungjing</title>
<link rel="icon" href="assets/logo.png">
<style>
:root{--navy:#12294d;--gold:#c9962c;--g:#14634a;--gl:#e6f3ee;--ink:#1c2430;--mut:#5b6573;--line:#d9dee6;--bg:#f4f6f9;--red:#b3261e;--redl:#fdecea;--amb:#8a5a00;--ambl:#fff4d6}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:20px 16px 16px;text-align:center}
header img{height:42px;margin:0 6px}header h1{font-size:20px;margin:8px 0 2px}header p{margin:0;opacity:.85;font-size:15px}
main{max-width:520px;margin:0 auto;padding:16px 16px 60px}
h2{font-size:19px;margin:6px 0 10px}
.kartu{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-left:6px solid var(--navy);border-radius:16px;padding:14px 16px;margin:0 0 10px;color:inherit;min-height:72px;cursor:pointer;font:inherit}
.kartu:active{transform:scale(.99)}.kartu .ic{flex:none;width:44px;height:44px;border-radius:12px;background:#eef2f9;display:grid;place-items:center;font-size:24px}
.kartu b{display:block;font-size:18px}.kartu span{display:block;color:var(--mut);font-size:14px}
.kartu.pic{border-left-color:var(--gold)}.kartu.stf{border-left-color:#2e7d6b}
.note{border-radius:12px;padding:10px 12px;font-size:14.5px;margin:12px 0;background:var(--gl);color:#0e4d39}
.note.warn{background:var(--ambl);color:var(--amb)}.note.err{background:var(--redl);color:var(--red)}
.fld{margin:0 0 14px}.fld label{display:block;font-weight:700;margin-bottom:2px}.fld .hint{color:var(--mut);font-size:14px;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:18px;background:#fff;min-height:52px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:3px solid #b9c8e6;border-color:var(--navy)}
.fld input.kode{font-size:30px;letter-spacing:.35em;text-align:center}
.msg{font-size:15px;margin:6px 0 10px;min-height:20px}.msg.err{color:var(--red)}.msg.ok{color:var(--g)}
.btn{border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;padding:14px 18px;cursor:pointer;min-height:52px;font-size:17px;width:100%}
.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy);margin-top:10px}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.link{background:none;color:var(--navy);text-decoration:underline;font-weight:600;min-height:44px;width:auto;padding:8px 0}
a.balik{display:block;text-align:center;margin-top:16px;color:var(--navy);font-weight:600}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.langkah{display:flex;gap:6px;margin:0 0 14px}.langkah i{flex:1;height:6px;border-radius:3px;background:var(--line)}.langkah i.on{background:var(--navy)}
.ok-ic{font-size:52px;text-align:center;margin:10px 0}
</style></head><body>
<header><img src="assets/logo-bgn.png" alt=""><img src="assets/logo.png" alt=""><h1>Verifikasi lewat WhatsApp</h1><p>Lupa password / PIN, atau daftar akun baru</p></header>
<main id="app"></main>
<script src="core/config.js?v=20260903b"></script>
<script src="core/common.js?v=20261014a"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var WA_ADMIN = 'https://wa.me/6285694765370?text=' + encodeURIComponent('Halo Admin, saya butuh bantuan akun Portal SPPG Jeungjing.');
  var JENIS = {
    RELAWAN: { nama: 'Relawan', masuk: 'login.html', ic: '👷' },
    STAFF: { nama: 'Staff', masuk: 'admin.html', ic: '🧑‍💼' },
    PIC: { nama: 'PIC', masuk: 'pic.html', ic: '📋' }
  };
  var S = { jenis: '', tujuan: '', hp: '', username: '', token: '', langkah: 0, jeda: 0, timer: null, divisi: [] };

  function h(tag, a, kids) {
    var e = document.createElement(tag); a = a || {};
    Object.keys(a).forEach(function (k) { if (k === 'text') e.textContent = a[k]; else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), a[k]); else if (k === 'class') e.className = a[k]; else e.setAttribute(k, a[k]); });
    (Array.isArray(kids) ? kids : kids === undefined ? [] : [kids]).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function bersih() { if (S.timer) { clearInterval(S.timer); S.timer = null; } app.textContent = ''; }
  function judul(t) { return h('h2', { text: t }); }
  function bar(n) { var w = h('div', { class: 'langkah' }); for (var i = 1; i <= 3; i++) w.appendChild(h('i', { class: i <= n ? 'on' : '' })); return w; }
  function adminLink() { return h('p', { style: 'text-align:center;font-size:14px;color:#5b6573' }, ['Butuh bantuan? ', h('a', { href: WA_ADMIN, target: '_blank', rel: 'noopener', text: 'Hubungi Admin lewat WhatsApp', style: 'color:#12294d;font-weight:700' })]); }
  function kembali(href, teks) { return h('a', { class: 'balik', href: href || 'masuk.html', text: teks || '← Kembali ke pilihan akun' }); }
  function judulJenis() { return JENIS[S.jenis].nama + (S.tujuan === 'DAFTAR' ? ' · Daftar akun baru' : S.jenis === 'PIC' ? ' · Buat / lupa PIN' : ' · Lupa password'); }

  /* ---- 0. pilih ---- */
  function pilih() {
    bersih(); S.token = ''; S.langkah = 0;
    app.appendChild(judul('Apa yang Anda perlukan?'));
    var kar = function (jenis, tujuan, ic, judulK, ket, kls) { return h('button', { class: 'kartu ' + (kls || ''), type: 'button', onclick: function () { mulai(jenis, tujuan); } }, [h('div', { class: 'ic', text: ic }), h('div', {}, [h('b', { text: judulK }), h('span', { text: ket })])]); };
    app.appendChild(kar('RELAWAN', 'RESET', '🔑', 'Relawan: lupa password', 'Minta kode lewat WhatsApp, lalu buat password baru.'));
    app.appendChild(kar('RELAWAN', 'DAFTAR', '📝', 'Relawan: daftar akun baru', 'Setelah diverifikasi, pendaftaran menunggu persetujuan Admin.'));
    app.appendChild(kar('STAFF', 'RESET', '🔑', 'Staff: lupa password', 'Untuk akun Staff (Admin Operasional).', 'stf'));
    app.appendChild(kar('STAFF', 'DAFTAR', '📝', 'Staff: daftar akun baru', 'Menunggu persetujuan Super Admin.', 'stf'));
    app.appendChild(kar('PIC', 'RESET', '📋', 'PIC: buat atau lupa PIN', 'Untuk PIC Posyandu dan satuan pendidikan yang sudah ditugaskan.', 'pic'));
    app.appendChild(h('div', { class: 'note warn', text: 'Akun Admin (akses penuh) tidak memakai kode WhatsApp. Hubungi pengelola sistem untuk reset.' }));
    app.appendChild(adminLink()); app.appendChild(kembali());
  }
  function mulai(jenis, tujuan) { S.jenis = jenis; S.tujuan = jenis === 'PIC' ? 'RESET' : tujuan; S.hp = ''; S.username = ''; formHp(); }

  /* ---- 1. nomor HP ---- */
  function formHp(pesan) {
    bersih(); S.langkah = 1;
    var hp = h('input', { type: 'tel', id: 'hp', inputmode: 'tel', autocomplete: 'tel', placeholder: '08xxxxxxxxxx', value: S.hp }),
      un = h('input', { type: 'text', id: 'un', autocomplete: 'username', autocapitalize: 'none', value: S.username }),
      jebak = h('input', { type: 'text', name: 'website', tabindex: '-1', autocomplete: 'off', 'aria-hidden': 'true' }),
      msg = h('div', { class: 'msg err', 'aria-live': 'polite', text: pesan || '' }),
      btn = h('button', { class: 'btn', type: 'button', text: 'Kirim kode ke WhatsApp', onclick: kirim });
    function kirim() {
      msg.textContent = ''; var nomor = hp.value.trim(); if (!nomor) { msg.textContent = 'Isi nomor HP.'; return; }
      btn.disabled = true; btn.textContent = 'Mengirim…';
      apiPost('otpMinta', { jenis: S.jenis, tujuan: S.tujuan, nomorHp: nomor, username: un.value.trim(), website: jebak.value }).then(function (r) {
        S.hp = nomor; S.username = un.value.trim(); S.jeda = (r && r.jedaDetik) || 60; formKode(r && r.pesan);
      }).catch(function (e) { msg.textContent = e.message; btn.disabled = false; btn.textContent = 'Kirim kode ke WhatsApp'; });
    }
    app.appendChild(bar(1)); app.appendChild(judul(judulJenis()));
    var f = [
      h('div', { class: 'fld' }, [h('label', { for: 'hp', text: 'Nomor WhatsApp' }), h('div', { class: 'hint', text: S.tujuan === 'DAFTAR' ? 'Nomor yang aktif di WhatsApp. Kode akan dikirim ke sini.' : S.jenis === 'PIC' ? 'Nomor HP yang terdaftar sebagai PIC di SPPG.' : 'Nomor HP yang tercatat pada akun Anda.' }), hp])
    ];
    if (S.tujuan === 'RESET' && S.jenis !== 'PIC') f.push(h('div', { class: 'fld' }, [h('label', { for: 'un', text: 'Username (boleh dikosongkan)' }), h('div', { class: 'hint', text: 'Isi bila satu nomor HP dipakai lebih dari satu akun.' }), un]));
    f.push(h('div', { class: 'hp', 'aria-hidden': 'true' }, [h('label', { text: 'Jangan isi kolom ini' }), jebak]));
    f.forEach(function (x) { app.appendChild(x); });
    if (S.jenis === 'PIC') app.appendChild(h('div', { class: 'note', text: 'PIC memakai PIN 6 angka yang dibuat sendiri setelah nomor diverifikasi. Nomor harus sudah ditugaskan sebagai PIC oleh Admin.' }));
    if (S.tujuan === 'DAFTAR') app.appendChild(h('div', { class: 'note', text: 'Pendaftaran tidak langsung aktif. Admin memeriksa dulu dan menyetujui.' }));
    app.appendChild(msg); app.appendChild(btn); app.appendChild(h('button', { class: 'btn link', type: 'button', text: '← Pilih yang lain', onclick: pilih })); app.appendChild(adminLink());
    hp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') kirim(); });
  }

  /* ---- 2. kode ---- */
  function formKode(pesanServer) {
    bersih(); S.langkah = 2;
    var kode = h('input', { type: 'text', id: 'kode', class: 'kode', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', placeholder: '••••••' }),
      msg = h('div', { class: 'msg err', 'aria-live': 'polite' }), btn = h('button', { class: 'btn', type: 'button', text: 'Periksa kode', onclick: cek }),
      ulang = h('button', { class: 'btn sec', type: 'button', disabled: 'disabled', text: 'Kirim ulang kode', onclick: function () { formHp(); } });
    function cek() {
      msg.textContent = ''; var k = kode.value.trim(); if (!/^\d{6}$/.test(k)) { msg.textContent = 'Isi 6 angka kode dari WhatsApp.'; return; }
      btn.disabled = true; btn.textContent = 'Memeriksa…';
      apiPost('otpVerifikasi', { jenis: S.jenis, tujuan: S.tujuan, nomorHp: S.hp, kode: k }).then(function (r) { S.token = r.token; formIsi(); })
        .catch(function (e) { msg.textContent = e.message; btn.disabled = false; btn.textContent = 'Periksa kode'; kode.value = ''; if (/hangus|kedaluwarsa/i.test(e.message)) ulang.disabled = false; });
    }
    kode.addEventListener('input', function () { kode.value = kode.value.replace(/\D/g, '').slice(0, 6); if (kode.value.length === 6) cek(); });
    app.appendChild(bar(2)); app.appendChild(judul('Masukkan kode dari WhatsApp'));
    app.appendChild(h('div', { class: 'note', text: pesanServer || 'Jika nomor memenuhi syarat, kode 6 angka sudah dikirim lewat WhatsApp. Berlaku 5 menit.' }));
    app.appendChild(h('div', { class: 'note warn', text: 'Tidak ada kode yang masuk? Pastikan nomor benar dan terdaftar. Demi keamanan, sistem tidak menyebut apakah nomor terdaftar.' }));
    app.appendChild(h('div', { class: 'fld' }, [h('label', { for: 'kode', text: 'Kode 6 angka' }), kode])); app.appendChild(msg); app.appendChild(btn); app.appendChild(ulang);
    var sisa = S.jeda; ulang.textContent = 'Kirim ulang kode (' + sisa + ')';
    S.timer = setInterval(function () { sisa--; if (sisa <= 0) { clearInterval(S.timer); S.timer = null; ulang.disabled = false; ulang.textContent = 'Kirim ulang kode'; } else ulang.textContent = 'Kirim ulang kode (' + sisa + ')'; }, 1000);
    app.appendChild(adminLink()); setTimeout(function () { kode.focus(); }, 50);
  }

  /* ---- 3. isi ---- */
  function formIsi(pesan) {
    bersih(); S.langkah = 3;
    if (S.tujuan === 'DAFTAR') return formDaftar(pesan);
    var pic = S.jenis === 'PIC';
    var p1 = h('input', { type: 'password', id: 'p1', autocomplete: 'new-password', inputmode: pic ? 'numeric' : 'text', maxlength: pic ? '6' : '72' }), p2 = h('input', { type: 'password', id: 'p2', autocomplete: 'new-password', inputmode: pic ? 'numeric' : 'text', maxlength: pic ? '6' : '72' }),
      lihat = h('input', { type: 'checkbox', id: 'lihat' }), msg = h('div', { class: 'msg err', 'aria-live': 'polite', text: pesan || '' }), btn = h('button', { class: 'btn', type: 'button', text: pic ? 'Simpan PIN' : 'Simpan password', onclick: simpan });
    if (pic) [p1, p2].forEach(function (x) { x.addEventListener('input', function () { x.value = x.value.replace(/\D/g, '').slice(0, 6); }); });
    lihat.addEventListener('change', function () { p1.type = p2.type = lihat.checked ? 'text' : 'password'; });
    function simpan() {
      msg.textContent = ''; if (p1.value !== p2.value) { msg.textContent = 'Pengulangan tidak sama.'; return; }
      if (pic && !/^\d{6}$/.test(p1.value)) { msg.textContent = 'PIN harus 6 angka.'; return; } if (!pic && p1.value.length < 8) { msg.textContent = 'Password minimal 8 karakter.'; return; }
      btn.disabled = true; btn.textContent = 'Menyimpan…';
      var body = { tokenOtp: S.token }; if (pic) body.pinBaru = p1.value; else { body.passwordBaru = p1.value; body.sandiUlang = p2.value; }
      apiPost('otpAtur', body).then(function (r) { selesai(r && r.pesan); }).catch(function (e) {
        msg.textContent = e.message; btn.disabled = false; btn.textContent = pic ? 'Simpan PIN' : 'Simpan password';
        if (/berakhir/i.test(e.message)) setTimeout(function () { formHp('Verifikasi sudah berakhir. Minta kode baru.'); }, 1800);
      });
    }
    app.appendChild(bar(3)); app.appendChild(judul(pic ? 'Buat PIN baru' : 'Buat password baru'));
    app.appendChild(h('div', { class: 'note', text: 'Nomor sudah terverifikasi. ' + (pic ? 'Pilih 6 angka yang tidak berurutan atau berulang. Jangan bagikan PIN.' : 'Minimal 8 karakter. Jangan sama dengan username.') }));
    app.appendChild(h('div', { class: 'fld' }, [h('label', { for: 'p1', text: pic ? 'PIN baru (6 angka)' : 'Password baru' }), p1])); app.appendChild(h('div', { class: 'fld' }, [h('label', { for: 'p2', text: 'Ulangi' }), p2]));
    app.appendChild(h('label', { style: 'display:flex;gap:8px;align-items:center;margin:0 0 12px;font-size:15px' }, [lihat, 'Tampilkan'])); app.appendChild(msg); app.appendChild(btn);
  }
  function formDaftar(pesan) {
    var staff = S.jenis === 'STAFF', val = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
    var nama = h('input', { type: 'text', id: 'nama', autocomplete: 'name' }), un = h('input', { type: 'text', id: 'dun', autocapitalize: 'none', autocomplete: 'username' }),
      p1 = h('input', { type: 'password', id: 'dp1', autocomplete: 'new-password' }), p2 = h('input', { type: 'password', id: 'dp2', autocomplete: 'new-password' }),
      cat = h('input', { type: 'text', id: 'cat', maxlength: '200' }), div = h('select', { id: 'div' }, [h('option', { value: '', text: 'Pilih divisi…' })].concat(S.divisi.map(function (d) { return h('option', { value: d, text: d }); })));
    var msg = h('div', { class: 'msg err', 'aria-live': 'polite', text: pesan || '' }), btn = h('button', { class: 'btn', type: 'button', text: 'Kirim pendaftaran', onclick: kirim });
    function kirim() {
      msg.textContent = ''; if (p1.value !== p2.value) { msg.textContent = 'Pengulangan password tidak sama.'; return; }
      if (nama.value.trim().length < 3) { msg.textContent = 'Isi nama lengkap.'; return; } if (!staff && !div.value) { msg.textContent = 'Pilih divisi.'; return; }
      btn.disabled = true; btn.textContent = 'Mengirim…';
      apiPost('pendaftaranKirim', { tokenOtp: S.token, nama: nama.value.trim(), divisi: div.value, username: un.value.trim(), password: p1.value, passwordUlang: p2.value, catatan: cat.value.trim() })
        .then(function (r) { selesai(r && r.pesan, true); }).catch(function (e) { msg.textContent = e.message; btn.disabled = false; btn.textContent = 'Kirim pendaftaran'; if (/berakhir/i.test(e.message)) setTimeout(function () { formHp('Verifikasi sudah berakhir. Minta kode baru.'); }, 1800); });
    }
    app.appendChild(bar(3)); app.appendChild(judul('Lengkapi pendaftaran'));
    app.appendChild(h('div', { class: 'note', text: 'Nomor sudah terverifikasi. Lengkapi data berikut. Anda baru bisa masuk setelah Admin menyetujui.' }));
    app.appendChild(h('div', { class: 'fld' }, [h('label', { for: 'nama', text: 'Nama lengkap' }), nama]));
    if (!staff) app.appendChild(h('div', { class: 'fld' }, [h('label', { for: 'div', text: 'Divisi' }), div]));
    app.appendChild(h('div', { class: 'fld' }, [h('label', { for: 'dun', text: 'Username' }), h('div', { class: 'hint', text: staff ? '3-40 karakter: huruf, angka, titik, garis bawah, strip.' : '4-40 karakter: huruf kecil, angka, titik, garis bawah.' }), un]));
    app.appendChild(h('div', { class: 'fld' }, [h('label', { for: 'dp1', text: 'Password' }), h('div', { class: 'hint', text: 'Minimal 8 karakter.' }), p1])); app.appendChild(h('div', { class: 'fld' }, [h('label', { for: 'dp2', text: 'Ulangi password' }), p2]));
    app.appendChild(h('div', { class: 'fld' }, [h('label', { for: 'cat', text: 'Catatan untuk Admin (boleh kosong)' }), h('div', { class: 'hint', text: staff ? 'Mis. jabatan dan atasan Anda.' : 'Mis. nama koordinator Anda.' }), cat]));
    app.appendChild(msg); app.appendChild(btn);
  }

  /* ---- 4. selesai ---- */
  function selesai(pesan, daftar) {
    bersih();
    app.appendChild(h('div', { class: 'ok-ic', text: daftar ? '📨' : '✅' })); app.appendChild(h('h2', { text: daftar ? 'Pendaftaran terkirim' : 'Berhasil', style: 'text-align:center' }));
    app.appendChild(h('div', { class: 'note', text: pesan || (daftar ? 'Pendaftaran menunggu persetujuan Admin.' : 'Tersimpan.') }));
    if (daftar) app.appendChild(h('div', { class: 'note warn', text: 'Anda belum bisa masuk sebelum Admin menyetujui. Bila lama, hubungi Admin dan sebutkan nomor HP yang didaftarkan.' }));
    else app.appendChild(h('a', { href: JENIS[S.jenis].masuk, class: 'btn', style: 'display:block;text-align:center;text-decoration:none;line-height:24px', text: 'Masuk sekarang' }));
    app.appendChild(kembali('portal.html', '← Kembali ke beranda')); S.token = '';
  }

  /* ---- mulai ---- */
  function awal() {
    app.appendChild(h('div', { class: 'note', text: 'Memeriksa layanan…' }));
    apiPost('getStatusOtp', {}).then(function (r) {
      bersih();
      if (!r || !r.aktif) { app.appendChild(h('div', { class: 'note warn', text: 'Layanan kode verifikasi WhatsApp belum aktif. Silakan hubungi Admin.' })); app.appendChild(adminLink()); app.appendChild(kembali()); return; }
      apiGet('getDivisi', {}).then(function (d) { S.divisi = Array.isArray(d) ? d : []; }).catch(function () { S.divisi = []; }).then(function () {
        var q = new URLSearchParams(location.search), j = (q.get('jenis') || '').toUpperCase(), m = (q.get('mode') || '').toLowerCase();
        if (JENIS[j]) mulai(j, m === 'daftar' ? 'DAFTAR' : 'RESET'); else pilih();
      });
    }).catch(function (e) { bersih(); app.appendChild(h('div', { class: 'note err', text: e.message })); app.appendChild(adminLink()); });
  }
  awal();
})();
</script>
</body></html>
