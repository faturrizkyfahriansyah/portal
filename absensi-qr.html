<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SIPRES — Absensi QR — SPPG Jeungjing</title>
<link rel="manifest" href="manifest-sipres.json">
<link rel="icon" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<meta name="theme-color" content="#0b2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --navy: #0b2340; --navy-2: #12305a; --gold: #c9962c;
    --sukses: #1a7a4c; --bahaya: #b23a3a; --info: #3b7dd8;
    --bg: #f4f5f7; --kartu: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff; padding: 14px 16px; text-align: center; flex-shrink: 0;
  }
  .header-logos { display: flex; justify-content: center; gap: 10px; margin-bottom: 6px; }
  .header-logos img { height: 34px; }
  .header h1 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .5px; }
  .header p { margin: 2px 0 0; font-size: 11px; opacity: .85; }

  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 14px; min-height: 0; }

  .kamera-wrap {
    position: relative; width: 100%; max-width: 420px; aspect-ratio: 1 / 1;
    background: #000; border-radius: 20px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(11,35,64,.25); border: 3px solid var(--navy);
  }
  .kamera-wrap video { width: 100%; height: 100%; object-fit: cover; }
  .kamera-target {
    position: absolute; inset: 12%; border: 3px solid rgba(255,255,255,.85); border-radius: 16px;
    box-shadow: 0 0 0 999px rgba(0,0,0,.25); pointer-events: none;
  }
  .kamera-target.sukses { border-color: var(--sukses); box-shadow: 0 0 0 999px rgba(26,122,76,.2); }
  .kamera-target.gagal { border-color: var(--bahaya); box-shadow: 0 0 0 999px rgba(178,58,58,.2); }

  .status-siap { font-size: 15px; font-weight: 800; color: var(--navy); text-align: center; }
  .status-instruksi { font-size: 13px; color: #667; text-align: center; margin-top: -8px; }

  .kartu-hasil {
    display: none; width: 100%; max-width: 420px; background: var(--kartu); border-radius: 20px;
    padding: 24px 20px; text-align: center; box-shadow: 0 10px 30px rgba(11,35,64,.15);
  }
  .kartu-hasil.tampil { display: block; }
  .hasil-ikon { font-size: 44px; line-height: 1; margin-bottom: 8px; }
  .hasil-judul { font-size: 20px; font-weight: 800; margin: 0 0 10px; }
  .hasil-nama { font-size: 18px; font-weight: 800; color: var(--navy); margin: 0; }
  .hasil-detail { font-size: 13px; color: #667; margin: 3px 0 0; }
  .hasil-jam { font-size: 28px; font-weight: 800; margin: 12px 0 0; letter-spacing: 1px; }
  .hasil-badge { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; padding: 4px 14px; border-radius: 20px; }

  .warna-sukses .hasil-ikon, .warna-sukses .hasil-judul { color: var(--sukses); }
  .warna-info .hasil-ikon, .warna-info .hasil-judul { color: var(--info); }
  .warna-bahaya .hasil-ikon, .warna-bahaya .hasil-judul { color: var(--bahaya); }

  .footer { text-align: center; padding: 8px; font-size: 10px; color: #99a; flex-shrink: 0; }

  #izinKameraOverlay {
    position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; z-index: 10;
  }
  #izinKameraOverlay.tersembunyi { display: none; }
  #izinKameraOverlay button {
    background: var(--navy); color: #fff; border: none; padding: 14px 28px; border-radius: 999px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logos">
    <img src="assets/logo-bgn.png" alt="Logo Badan Gizi Nasional">
    <img src="assets/logo.png" alt="Logo SPPG Jeungjing">
  </div>
  <h1>SIPRES — ABSENSI QR</h1>
  <p>SPPG Jeungjing</p>
</div>

<div class="stage">
  <div class="kamera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="kamera-target" id="kameraTarget"></div>
  </div>
  <p class="status-siap" id="statusSiap">SIAP MEMBACA</p>
  <p class="status-instruksi" id="statusInstruksi">Arahkan QR kartu ke area kamera</p>

  <div class="kartu-hasil" id="kartuHasil">
    <div class="hasil-ikon" id="hasilIkon">✓</div>
    <p class="hasil-judul" id="hasilJudul">ABSENSI BERHASIL</p>
    <p class="hasil-nama" id="hasilNama">-</p>
    <p class="hasil-detail" id="hasilDivisi">-</p>
    <p class="hasil-detail" id="hasilPesan"></p>
    <p class="hasil-jam" id="hasilJam"></p>
    <span class="hasil-badge" id="hasilBadge" style="display:none;"></span>
  </div>
</div>

<p class="footer">SIPRES © 2026 SPPG Jeungjing</p>

<div id="izinKameraOverlay">
  <img src="assets/logo.png" alt="Logo SPPG" style="height:56px;">
  <p style="font-size:15px;font-weight:700;color:#0b2340;margin:0;">Izinkan Akses Kamera</p>
  <p style="font-size:13px;color:#667;margin:0;max-width:280px;">Halaman ini butuh kamera untuk membaca QR kartu absensi relawan.</p>
  <button type="button" id="btnMulaiKamera">Mulai Kamera</button>
  <p id="pesanErrorKamera" style="font-size:12px;color:#b23a3a;margin:0;"></p>
</div>

<script>
// SIPRES QR DECODER LOADER — coba sumber berurutan. Kamera tidak dimulai
// sebelum decoder benar-benar siap. Sumber utama GitHub Raw, lalu CDN fallback.
window.sipresQrReady = (async function () {
  const sources = [
    'jsQR.js',
    'https://raw.githubusercontent.com/cozmo/jsQR/master/dist/jsQR.js',
    'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js',
    'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js'
  ];
  for (const src of sources) {
    try {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.async = true; s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
      if (typeof window.jsQR === 'function') return true;
    } catch (_) {}
  }
  return false;
})();
</script>
<script src="config.js?v=20260929a"></script>
<script src="common.js?v=20260929a"></script>
<script src="absensi-qr.js?v=20261001b"></script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {})); }
</script>
</body>
</html>
